<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Web MIDI Piano</title>

		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="bookmark" href="favicon.ico" />

		<link rel="stylesheet" href="src/css/style.css" />
		<script src="opensheetmusicdisplay.min.js"></script>
	</head>
	<body>
		<h1>Schema</h1>

		<body class="nav-collapsed"></body>

		<div class="top-panel">
			<button id="midiBtn">Enable MIDI</button>
			<span id="midiStatus">No MIDI</span>
			<input type="file" id="File" accept=".xml, .musicxml, .mxl" />
			<button id="playBtn">Play</button>
			<button id="stopBtn">Stop</button>
			<button id="nextBtn">Next</button>
			<button id="stepBtn">Step</button>

			<label>
				<input type="checkbox" id="emphasisCb" />
				強調數字音符
			</label>

			<label>
				<input type="checkbox" id="hintColorCb" />
				指示器顏色
			</label>

			<label>
				<input type="checkbox" id="metroCb" />
				節拍器
			</label>

			<div class="bpm-control">
				<label for="bpmSlider">速度: <span id="bpmValue">1.00x</span></label>
				<input type="range" id="bpmSlider" min="0.25" max="2" value="1" step="0.05" />
			</div>
		</div>

		<div id="main">
			<nav id="nav">
				<ul id="scoreList"></ul>
			</nav>
			<button id="navToggle">☰</button>

			<div id="workspace">
				<div id="osmdContainer"></div>
				<div id="splitter" role="separator" aria-orientation="vertical"></div>
				<div id="docPane">
					<div id="docContent"></div>
				</div>
			</div>
		</div>

		<div id="piano"></div>

		<script type="module" src="src/js/main.js"></script>
		<script></script>
	</body>
</html>
