<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Web MIDI Piano</title>

		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="bookmark" href="favicon.ico" />

		<link rel="stylesheet" href="src/css/style.css" />
		<script src="opensheetmusicdisplay.min.js"></script>
	</head>
	<body>
		<h1>Schema</h1>

		<div class="top-panel">
			<button id="midiBtn">Enable MIDI</button>
			<span id="midiStatus">No MIDI</span>
			<input type="file" id="File" accept=".xml, .musicxml, .mxl" />
			<button id="playBtn">Play</button>
			<button id="stopBtn">Stop</button>
			<button id="nextBtn">Next</button>
			<button id="openPianoBtn">Open Piano</button>

			<div class="bpm-control">
				<label for="bpmSlider">BPM: <span id="bpmValue">60</span></label>
				<input type="range" id="bpmSlider" min="20" max="240" value="60" step="1">
			</div>
		</div>

		<div id="osmdContainer"></div>

		<div class="piano suit">
			<div id="piano"></div>
		</div>

		<script type="module" src="src/js/main.js"></script>
		<script></script>
	</body>
</html>
