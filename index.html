<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Web MIDI Piano</title>

		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="bookmark" href="favicon.ico" />

		<link rel="stylesheet" href="src/css/style.css" />
		<script src="opensheetmusicdisplay.min.js"></script>
	</head>
	<body>
		<h1>Schema</h1>

		<div class="top-panel">
			<button id="midiBtn">Enable MIDI</button>
			<span id="midiStatus">No MIDI</span>
			<input type="file" id="File" accept=".xml, .musicxml, .mxl" />
			<button id="playBtn">Play</button>
			<button id="stopBtn">Stop</button>
			<button id="nextBtn">Next</button>
			<button id="stepBtn">Step</button>
			<button id="openPianoBtn">Open Piano</button>

			<label>
				<input type="checkbox" id="emphasisCb" />
				強調數字音符
			</label>

			<div class="bpm-control">
				<label for="bpmSlider"
					>速度: <span id="bpmValue">1.00x</span></label
				>
				<input
					type="range"
					id="bpmSlider"
					min="0.25"
					max="2"
					value="1"
					step="0.05"
				/>
			</div>

			<select id="scoreSelect">
				<option value="">-- 選擇樂譜 --</option>
			</select>
		</div>

		<div id="osmdContainer"></div>
		<div id="piano"></div>

		<script type="module" src="src/js/main.js"></script>
		<script></script>
	</body>
</html>
